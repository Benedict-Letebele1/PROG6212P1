name: RaceDay API - Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore the EF Core tools from the manifest
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore RaceDay.sln

      - name: Build the solution
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Run the unit tests
        run: dotnet test RaceDay.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Check that the migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project RaceDayApi --startup-project RaceDayApi

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
